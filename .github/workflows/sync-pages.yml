name: Sync and deploy bookshelf pages

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. Run at minute 17 of each hour.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-pages.yml

permissions:
  contents: read

concurrency:
  group: bookshelf-pages
  cancel-in-progress: false

jobs:
  build:
    name: Sync the private source and build the public site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check private source credential
        env:
          SOURCE_TOKEN: ${{ secrets.BOOKSHELF_SOURCE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::Add the BOOKSHELF_SOURCE_TOKEN Actions repository secret in maslke/my-bookshelf. Use a fine-grained token with Contents: read access to maslke/bookshelf-app."
            exit 1
          fi

      - name: Checkout the page source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: maslke/bookshelf-app
          ref: main
          token: ${{ secrets.BOOKSHELF_SOURCE_TOKEN }}
          persist-credentials: false
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/
            /scripts/build-site.py

      - name: Build the static site
        shell: bash
        run: |
          python3 source/scripts/build-site.py \
            --output-dir "$RUNNER_TEMP/bookshelf-site" \
            --no-readme

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload only the exported site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/bookshelf-site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
